{% extends "admin/base.html" %}{% block content %}<div class="page-title"><h1>{{'編輯' if r else '新增'}}照護資源</h1></div><form class="panel form-grid" method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf" value="{{csrf_token()}}">
<div class="form-group"><label>院所名稱 *</label><input name="name" required value="{{r.name if r else ''}}"></div><div class="form-group"><label>網址 Slug</label><input name="slug" value="{{r.slug if r else ''}}" placeholder="可留空自動產生"></div>
<div class="form-group"><label>類型 *</label><select name="type">{% for t in ['醫院','診所','居家護理所','其他專業資源'] %}<option {% if r and r.type==t %}selected{% endif %}>{{t}}</option>{% endfor %}</select></div><div class="form-group"><label>縣市 *</label><input name="city" required value="{{r.city if r else ''}}"></div>
<div class="form-group"><label>行政區</label><input name="district" value="{{r.district if r else ''}}"></div><div class="form-group"><label>地址</label><input name="address" value="{{r.address if r else ''}}"></div>
<div class="form-group"><label>電話</label><input name="phone" value="{{r.phone if r else ''}}"></div><div class="form-group"><label>Email</label><input name="email" value="{{r.email if r else ''}}"></div>
<div class="form-group"><label>官方網站</label><input name="website" value="{{r.website if r else ''}}"></div><div class="form-group"><label>預約連結</label><input name="booking_url" value="{{r.booking_url if r else ''}}"></div>
<div class="form-group full"><label>院所介紹</label><textarea name="description">{{r.description if r else ''}}</textarea></div>
<div class="form-group full"><label>傷口服務項目</label><input name="services" value="{{r.services if r else ''}}" placeholder="用逗號分隔，例如：糖尿病足,壓瘡,術後傷口,清創"></div>
<div class="form-group"><label>服務時間</label><input name="service_hours" value="{{r.service_hours if r else ''}}"></div><div class="form-group"><label>居護服務區域</label><input name="service_area" value="{{r.service_area if r else ''}}"></div>
<div class="form-group"><label>緯度 Lat</label><input name="lat" value="{{r.lat if r and r.lat is not none else ''}}"></div><div class="form-group"><label>經度 Lng</label><input name="lng" value="{{r.lng if r and r.lng is not none else ''}}"></div>
<div class="form-group"><label>院所圖片</label><input type="file" name="image" accept=".png,.jpg,.jpeg,.webp">{% if r and r.image_path %}<span class="help">目前：{{r.image_path}}</span>{% endif %}</div><div class="form-group"><label>資料來源／驗證備註</label><input name="source_note" value="{{r.source_note if r else ''}}"></div>
<div class="form-group full checks"><label><input type="checkbox" name="verified" {% if r and r.verified %}checked{% endif %}> 已驗證</label><label><input type="checkbox" name="featured" {% if r and r.featured %}checked{% endif %}> 首頁精選</label><label><input type="checkbox" name="published" {% if not r or r.published %}checked{% endif %}> 公開發布</label></div><div class="form-group full"><button class="btn primary">儲存</button></div></form>{% endblock %}
