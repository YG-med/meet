{% extends "admin/base.html" %}{% block content %}<div class="page-title"><h1>{{'編輯' if e else '新增'}}專業人員</h1></div><form class="panel form-grid" method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><div class="form-group"><label>姓名</label><input name="name" required value="{{e.name if e else ''}}"></div><div class="form-group"><label>角色</label><input name="role_title" required value="{{e.role_title if e else ''}}" placeholder="例如：Medical Director"></div><div class="form-group"><label>專長</label><input name="specialty" value="{{e.specialty if e else ''}}"></div><div class="form-group"><label>服務單位</label><input name="organization" value="{{e.organization if e else ''}}"></div><div class="form-group full"><label>簡介</label><textarea name="bio">{{e.bio if e else ''}}</textarea></div><div class="form-group"><label>照片</label><input type="file" name="image" accept=".png,.jpg,.jpeg,.webp"></div><div class="form-group"><label>排序</label><input name="sort_order" type="number" value="{{e.sort_order if e else 0}}"></div><div class="form-group full checks"><label><input type="checkbox" name="published" {% if not e or e.published %}checked{% endif %}> 公開發布</label></div><div class="form-group full"><button class="btn primary">儲存</button></div></form>{% endblock %}
