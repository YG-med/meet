{% extends "admin/base.html" %}{% block content %}<div class="page-title"><h1>合作洽詢</h1></div><div class="panel"><table class="table"><tr><th>日期</th><th>姓名／單位</th><th>聯絡</th><th>類型</th><th>內容</th><th>狀態</th></tr>{% for r in rows %}<tr><td>{{r.created_at}}</td><td><b>{{r.name}}</b><br>{{r.organization}}</td><td>{{r.email}}<br>{{r.phone}}</td><td>{{r.inquiry_type}}</td><td>{{r.message}}</td><td><form method="post" action="/admin/inquiries/{{r.id}}/status"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><select name="status" onchange="this.form.submit()"><option value="new" {% if r.status=='new' %}selected{% endif %}>新案件</option><option value="contacted" {% if r.status=='contacted' %}selected{% endif %}>已聯繫</option><option value="closed" {% if r.status=='closed' %}selected{% endif %}>結案</option></select></form></td></tr>{% endfor %}</table></div>{% endblock %}
