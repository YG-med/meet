{% extends "admin/base.html" %}{% block content %}<div class="page-title"><h1>文章管理</h1><a class="btn primary" href="/admin/articles/new">＋ 新增文章</a></div><div class="panel"><table class="table"><tr><th>標題</th><th>分類</th><th>審閱者</th><th>贊助</th><th>精選</th><th>發布</th><th>操作</th></tr>{% for a in rows %}<tr><td><b>{{a.title}}</b><br><span class="help">{{a.slug}}</span></td><td>{{a.category}}</td><td>{{a.reviewer or '待指派'}}</td><td>{{'✓' if a.sponsored else '—'}}</td><td>{{'✓' if a.featured else '—'}}</td><td>{{'✓' if a.published else '—'}}</td><td><a href="/admin/articles/{{a.id}}/edit">編輯</a>　<form style="display:inline" method="post" action="/admin/articles/{{a.id}}/delete" onsubmit="return confirm('確定刪除？')"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><button class="btn danger">刪除</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
