{% extends "admin/base.html" %}{% block content %}<div class="page-title"><h1>醫療團隊</h1><a class="btn primary" href="/admin/experts/new">＋ 新增專業人員</a></div><div class="panel"><table class="table"><tr><th>排序</th><th>姓名</th><th>角色</th><th>專長</th><th>單位</th><th>發布</th><th>操作</th></tr>{% for e in rows %}<tr><td>{{e.sort_order}}</td><td>{{e.name}}</td><td>{{e.role_title}}</td><td>{{e.specialty}}</td><td>{{e.organization}}</td><td>{{'✓' if e.published else '—'}}</td><td><a href="/admin/experts/{{e.id}}/edit">編輯</a>　<form style="display:inline" method="post" action="/admin/experts/{{e.id}}/delete"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><button class="btn danger">刪除</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
