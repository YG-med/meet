{% extends "admin/base.html" %}{% block content %}<div class="page-title"><h1>電子報訂閱者</h1><a class="btn" href="/admin/subscribers/export.csv">匯出 CSV</a></div><div class="panel"><table class="table"><tr><th>Email</th><th>來源</th><th>狀態</th><th>日期</th><th>操作</th></tr>{% for r in rows %}<tr><td>{{r.email}}</td><td>{{r.source}}</td><td>{{'有效' if r.active else '停用'}}</td><td>{{r.created_at}}</td><td><form method="post" action="/admin/subscribers/{{r.id}}/toggle"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><button class="btn">{{'停用' if r.active else '啟用'}}</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
