{% extends "admin/base.html" %}{% block content %}<div class="page-title"><h1>{{'編輯' if q else '新增'}}導航題目</h1></div><form class="panel form-grid" method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><div class="form-group full"><label>問題</label><input name="question" required value="{{q.question if q else ''}}"></div><div class="form-group full"><label>說明</label><input name="help_text" value="{{q.help_text if q else ''}}"></div><div class="form-group"><label>排序</label><input name="sort_order" type="number" value="{{q.sort_order if q else 0}}"></div><div class="form-group"><label>狀態</label><label><input type="checkbox" name="published" {% if not q or q.published %}checked{% endif %}> 公開</label></div><div class="form-group full"><label>選項與風險等級</label><div class="options-wrap" id="options">{% if opts %}{% for o in opts %}<div class="option-row"><input name="option_label" value="{{o.label}}"><select name="option_risk"><option value="0" {% if o.risk_level==0 %}selected{% endif %}>0 一般</option><option value="1" {% if o.risk_level==1 %}selected{% endif %}>1 近期評估</option><option value="2" {% if o.risk_level==2 %}selected{% endif %}>2 儘速就醫</option></select></div>{% endfor %}{% else %}{% for i in range(3) %}<div class="option-row"><input name="option_label"><select name="option_risk"><option value="0">0 一般</option><option value="1">1 近期評估</option><option value="2">2 儘速就醫</option></select></div>{% endfor %}{% endif %}</div></div><div class="form-group full"><button class="btn primary">儲存</button></div></form>{% endblock %}
