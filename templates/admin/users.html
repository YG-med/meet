{% extends "admin/base.html" %}{% block content %}<div class="page-title"><h1>管理員帳號</h1><a class="btn primary" href="/admin/users/new">＋ 新增管理員</a></div><div class="panel"><table class="table"><tr><th>帳號</th><th>名稱</th><th>角色</th><th>狀態</th><th>最後登入</th><th>操作</th></tr>{% for u in rows %}<tr><td>{{u.username}}</td><td>{{u.display_name}}</td><td>{{u.role}}</td><td>{{'啟用' if u.active else '停用'}}</td><td>{{u.last_login_at or '—'}}</td><td><a href="/admin/users/{{u.id}}/edit">編輯</a></td></tr>{% endfor %}</table></div>{% endblock %}
