{% extends "admin/base.html" %}{% block content %}<div class="page-title"><h1>{{'編輯' if a else '新增'}}文章</h1></div><form class="panel form-grid" method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf" value="{{csrf_token()}}">
<div class="form-group full"><label>文章標題 *</label><input name="title" required value="{{a.title if a else ''}}"></div><div class="form-group"><label>Slug</label><input name="slug" value="{{a.slug if a else ''}}"></div><div class="form-group"><label>分類</label><input name="category" value="{{a.category if a else ''}}"></div>
<div class="form-group full"><label>摘要</label><textarea name="summary">{{a.summary if a else ''}}</textarea></div><div class="form-group full"><label>正文（可使用基本HTML）</label><textarea name="body" style="min-height:360px">{{a.body if a else ''}}</textarea></div>
<div class="form-group"><label>內容製作／作者</label><input name="author" value="{{a.author if a else '平台編輯團隊'}}"></div><div class="form-group"><label>醫療審閱者</label><input name="reviewer" value="{{a.reviewer if a else ''}}"></div>
<div class="form-group full"><label>參考資料</label><textarea name="references_text">{{a.references_text if a else ''}}</textarea></div><div class="form-group full"><label>利益揭露</label><textarea name="conflict_disclosure">{{a.conflict_disclosure if a else ''}}</textarea></div>
<div class="form-group"><label>封面圖片</label><input type="file" name="cover" accept=".png,.jpg,.jpeg,.webp"></div><div class="form-group"><label>SEO Title</label><input name="meta_title" value="{{a.meta_title if a else ''}}"></div><div class="form-group full"><label>Meta Description</label><textarea name="meta_description">{{a.meta_description if a else ''}}</textarea></div>
<div class="form-group full checks"><label><input type="checkbox" name="sponsored" {% if a and a.sponsored %}checked{% endif %}> 贊助內容</label><label><input type="checkbox" name="featured" {% if a and a.featured %}checked{% endif %}> 首頁精選</label><label><input type="checkbox" name="published" {% if not a or a.published %}checked{% endif %}> 公開發布</label></div><div class="form-group full"><button class="btn primary">儲存</button></div></form>{% endblock %}
