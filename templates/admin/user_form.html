{% extends "admin/base.html" %}{% block content %}<div class="page-title"><h1>{{'編輯' if u else '新增'}}管理員</h1></div><form class="panel form-grid" method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}">{% if not u %}<div class="form-group"><label>帳號</label><input name="username" required></div>{% else %}<div class="form-group"><label>帳號</label><input value="{{u.username}}" disabled></div>{% endif %}<div class="form-group"><label>顯示名稱</label><input name="display_name" required value="{{u.display_name if u else ''}}"></div><div class="form-group"><label>角色</label><select name="role"><option value="editor" {% if u and u.role=='editor' %}selected{% endif %}>editor 編輯</option><option value="admin" {% if not u or u.role=='admin' %}selected{% endif %}>admin 管理員</option></select></div><div class="form-group"><label>{{'新密碼（不改可留空）' if u else '密碼'}}</label><input name="password" type="password" {% if not u %}required{% endif %}></div>{% if u %}<div class="form-group full"><label><input type="checkbox" name="active" {% if u.active %}checked{% endif %}> 啟用帳號</label></div>{% endif %}<div class="form-group full"><button class="btn primary">儲存</button></div></form>{% endblock %}
