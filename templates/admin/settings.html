{% extends "admin/base.html" %}{% block content %}<div class="page-title"><h1>網站設定</h1></div><form class="panel form-grid" method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><div class="form-group"><label>網站名稱</label><input name="site_name" value="{{settings.site_name}}"></div><div class="form-group"><label>品牌標語</label><input name="tagline" value="{{settings.tagline}}"></div><div class="form-group"><label>聯絡 Email</label><input name="contact_email" value="{{settings.contact_email}}"></div><div class="form-group"><label>正式網址</label><input name="site_url" value="{{settings.site_url}}"></div><div class="form-group"><label>LINE URL</label><input name="line_url" value="{{settings.line_url}}"></div><div class="form-group"><label>Facebook URL</label><input name="facebook_url" value="{{settings.facebook_url}}"></div><div class="form-group"><label>GA4 ID</label><input name="ga4_id" value="{{settings.ga4_id}}" placeholder="G-XXXXXXXXXX"></div><div class="form-group full"><button class="btn primary">儲存設定</button></div></form>{% endblock %}
