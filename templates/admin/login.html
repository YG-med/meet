<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>癒見 CMS 登入</title><link rel="stylesheet" href="{{url_for('static',filename='css/admin.css')}}"></head><body><div class="login-wrap"><div class="login-card"><h1>癒見 CMS</h1><p class="help">慢性傷口照護網管理後台</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form class="form" method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><div class="form-group"><label>帳號</label><input name="username" required></div><div class="form-group"><label>密碼</label><input name="password" type="password" required></div><button class="btn primary">登入</button></form></div></div></body></html>
